# Diphone-target GRU, 512D TC+SBP English copy task.
#
# Everything outside the `diphone:` block has the same meaning as in
# model_training/rnn_args_electrode.yaml -- this config is consumed by the same
# trainer code paths, just via alt_models/train_diphone.py.
#
#   cd Speech/model_training
#   python alt_models/train_diphone.py alt_models/rnn_args_diphone.yaml

model:
  n_input_features: 512 # [TC Elec1..256 | SBP Elec1..256]
  n_units: 768
  rnn_dropout: 0.4
  rnn_trainable: true
  n_layers: 5
  patch_size: 14
  patch_stride: 4

  input_network:
    n_input_layers: 1
    input_layer_sizes:
    - 512
    input_trainable: true
    input_layer_dropout: 0.2

gpu_number: '1'
mode: train
use_amp: true

output_dir: trained_models/diphone_rnn_electrode_512
checkpoint_dir: trained_models/diphone_rnn_electrode_512/checkpoint
init_from_checkpoint: false
init_checkpoint_path: None
save_best_checkpoint: true
save_all_val_steps: false
save_final_model: false
save_val_metrics: true
early_stopping: false
early_stopping_val_steps: 20

# The diphone head has 1 + 34*34 = 1157 classes instead of 35, so it needs more
# optimisation steps than the monophone baseline to reach the same loss. The
# baseline README documents 120,000 batches for the full paper run; 20,000 is a
# middle ground that already gets well past the 2,000 the current 512D configs
# use. Raise this (and lr_decay_steps with it) if the val PER is still falling
# at the end of training.
num_training_batches: 20000
lr_scheduler_type: cosine
lr_max: 0.005
lr_min: 0.0001
lr_decay_steps: 20000
lr_warmup_steps: 200
lr_max_day: 0.005
lr_min_day: 0.0001
lr_decay_steps_day: 20000
lr_warmup_steps_day: 200

beta0: 0.9
beta1: 0.999
epsilon: 0.1
weight_decay: 0.001
weight_decay_day: 0
seed: 10
grad_norm_clip_value: 10

batches_per_train_log: 200
batches_per_val_step: 1000

batches_per_save: 0
log_individual_day_val_PER: true
log_val_skip_logs: false
save_val_logits: true
save_val_data: false

# ---------------------------------------------------------------------------
# Diphone-specific knobs. Read by DiphoneTrainer.resolve_diphone_options.
# ---------------------------------------------------------------------------
diphone:
  # false -> a length-L phoneme sequence becomes L-1 consecutive diphones, the
  #          textbook DCoND formulation. Strictly easier for CTC than the
  #          baseline (which needed L frames), and recovers all L phonemes on
  #          marginalisation.
  # true  -> the sequence is closed with <sil>, giving L diphones and the exact
  #          target length the monophone baseline used.
  close_with_sil: false
  # Class id of <sil> used as the closing symbol when close_with_sil is true.
  # null means "use n_classes - 1", which is 34 for the 35-class English set --
  # verified against the session metadata, where <sil> is indeed the last label.
  sil_phoneme_id: null

dataset:
  data_transforms:
    white_noise_std: 1.0
    constant_offset_std: 0.2
    random_walk_std: 0.0
    random_walk_axis: -1
    static_gain_std: 0.0
    random_cut: 3
    smooth_kernel_size: 100
    smooth_data: true
    smooth_kernel_std: 2

  neural_dim: 512
  batch_size: 64
  n_classes: 35 # phoneme classes: blank + 33 phonemes + <sil>. NOT the diphone
                # count -- DiphoneGRUDecoder derives 1 + 34*34 internally, which
                # keeps this file and evaluate_model_extended.py unaware.
  max_seq_elements: 500
  days_per_batch: 1
  seed: 1
  num_dataloader_workers: 4
  loader_shuffle: false
  must_include_days: null
  test_percentage: 0.1
  feature_subset: null

  dataset_dir: ../data/hdf5_data_512
  bad_trials_dict: null

  # Sessions are listed in day-index order; dataset_probability_val[i] == 1 puts
  # day i into the validation set. Add one entry per day for multi-day training.
  # `python alt_models/make_all_day_config.py` writes this block for you from
  # whatever is on disk.
  sessions:
  - t15.2026.08.14.10-11-24_tc_sbp_512
  dataset_probability_val:
  - 1
